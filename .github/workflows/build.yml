name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------- 桌面端构建 ----------
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        # https://tauri.app/start/prerequisites/#linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/appimage/*.AppImage' || '' }}
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/deb/*.deb' || '' }}
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/rpm/*.rpm' || '' }}
            ${{ runner.os == 'Windows' && 'src-tauri/target/release/bundle/nsis/*.exe' || '' }}
            ${{ runner.os == 'Windows' && 'src-tauri/target/release/bundle/msi/*.msi' || '' }}
            ${{ runner.os == 'macOS' && 'src-tauri/target/release/bundle/dmg/*.dmg' || '' }}
          if-no-files-found: warn

  # ---------- Android 构建 ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components (Platform 36, Build-Tools 36, NDK 28.2.13676358)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/*.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Generate keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: npm run tauri android build -- --apk

      - name: Build debug APK
        run: npm run tauri android build -- --apk --debug

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
