name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        # https://tauri.app/start/prerequisites/#linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/appimage/*.AppImage' || '' }}
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/deb/*.deb' || '' }}
            ${{ runner.os == 'Linux' && 'src-tauri/target/release/bundle/rpm/*.rpm' || '' }}
            ${{ runner.os == 'Windows' && 'src-tauri/target/release/bundle/nsis/*.exe' || '' }}
            ${{ runner.os == 'Windows' && 'src-tauri/target/release/bundle/msi/*.msi' || '' }}
            ${{ runner.os == 'macOS' && 'src-tauri/target/release/bundle/dmg/*.dmg' || '' }}
          if-no-files-found: warn
